[project]
name = "algo-trade"
version = "0.1.0"
description = "Algorithmic trading project"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "pyarrow",
    "fastapi",
    "uvicorn[standard]",
    "kiteconnect",
    "python-dotenv",
    "apscheduler",
    "boto3",
    "pyotp",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]